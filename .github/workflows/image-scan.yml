# Weekly OSV-Scanner scan of the published image (plan S-09): catches vulnerabilities disclosed
# after a release. Same policy as the release gate (scripts/osv-image-gate.py, osv-scanner.toml),
# on both platforms of ghcr.io/<owner>/dockhand-mcp:latest. A blocking finding fails the run, and
# GitHub emails the failure (for scheduled runs, to whoever last changed the cron line). The
# findings go to the job summary. Not a required check; it never runs on pull requests.
name: image-scan

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: image-scan
  cancel-in-progress: false

env:
  OSV_SCANNER_VERSION: v2.6.0
  # sha256 of osv-scanner_linux_amd64 from the release above (its osv-scanner_SHA256SUMS).
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve :latest
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/dockhand-mcp"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if ! docker buildx imagetools inspect "$image:latest" --raw > "$RUNNER_TEMP/index.json" 2> "$RUNNER_TEMP/inspect.err"; then
            if grep -qiE 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/inspect.err"; then
              echo "::notice::$image:latest does not exist yet; nothing to scan"
              echo "No \`$image:latest\` published yet: nothing to scan." >> "$GITHUB_STEP_SUMMARY"
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - name: Pull each platform and export it
        if: steps.image.outputs.found == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          for arch in amd64 arm64; do
            manifest=$(jq -r --arg a "$arch" '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$a) | .digest' "$RUNNER_TEMP/index.json")
            [[ "$manifest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no linux/$arch manifest in :latest"; exit 1; }
            docker pull --quiet "$IMAGE@$manifest"
            docker tag "$IMAGE@$manifest" "dockhand-mcp-scan:$arch"
            docker save -o "$RUNNER_TEMP/image-linux-$arch.tar" "dockhand-mcp-scan:$arch"
          done

      - name: OSV-Scanner (release gate policy)
        if: steps.image.outputs.found == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          bin="$RUNNER_TEMP/osv-scanner"
          python3 -c "import sys,urllib.request;urllib.request.urlretrieve(sys.argv[1],sys.argv[2])" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" "$bin"
          echo "${OSV_SCANNER_SHA256}  $bin" | sha256sum --check --strict
          chmod +x "$bin"
          for arch in amd64 arm64; do
            rc=0
            "$bin" scan image --config osv-scanner.toml --archive "$RUNNER_TEMP/image-linux-$arch.tar" \
              --format json --output-file "$RUNNER_TEMP/osv-$arch.json" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
              echo "::error::OSV-Scanner failed on linux/$arch (exit $rc)"
              exit 1
            fi
          done
          echo "Scanned \`$IMAGE:latest\` (\`$DIGEST\`)." >> "$GITHUB_STEP_SUMMARY"
          rc=0
          uv run --no-project scripts/osv-image-gate.py \
            "linux/amd64=$RUNNER_TEMP/osv-amd64.json" "linux/arm64=$RUNNER_TEMP/osv-arm64.json" \
            > "$RUNNER_TEMP/gate.md" || rc=$?
          cat "$RUNNER_TEMP/gate.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
