# Invented, not recorded: a small lockfile in the format uv 0.13 writes (version 1, revision 5).
# Package names are real PyPI projects so the PURLs look like the real thing; versions, wheels and
# hashes are trimmed to what scripts/dependency-snapshot.py reads.
version = 1
revision = 5
requires-python = ">=3.15"

[[package]]
name = "anyio"
version = "4.12.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "certifi"
version = "2026.10.23"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "cffi"
version = "2.1.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "cryptography"
version = "50.0.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "cffi", marker = "platform_python_implementation != 'PyPy'" },
]

[[package]]
name = "demo-app"
version = "1.2.3"
source = { editable = "." }
dependencies = [
    { name = "httpx" },
    { name = "mcp" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "respx" },
]

[package.metadata]
requires-dist = [
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "mcp", specifier = ">=2.3.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=9.1.1" },
    { name = "respx", specifier = ">=0.23.1" },
]

[[package]]
name = "httpx"
version = "0.28.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "anyio", marker = "sys_platform != 'emscripten'" },
    { name = "certifi" },
]

[[package]]
name = "iniconfig"
version = "2.3.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "mcp"
version = "2.3.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "opentelemetry-api" },
    { name = "pyjwt", extra = ["crypto"] },
]

[[package]]
name = "opentelemetry-api"
version = "1.45.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pyjwt"
version = "2.12.1"
source = { registry = "https://pypi.org/simple" }

[package.optional-dependencies]
crypto = [
    { name = "cryptography" },
]

[[package]]
name = "pytest"
version = "9.1.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "colorama", marker = "sys_platform == 'win32'" },
    { name = "iniconfig" },
]

[[package]]
name = "respx"
version = "0.23.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "httpx" },
]
